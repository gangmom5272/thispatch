# 서버 배포용 설정.
#
# 언제 읽히나
#   SPRING_PROFILES_ACTIVE=prod 로 띄우면 application.yaml 과 함께 읽힌다.
#   서버1 에서는 infra/.env 가 그 값을 주고, infra/compose.server.yaml 이
#   컨테이너에 넘긴다.
#
# dev 와 무엇이 다른가
#   dev 에는 이런 줄이 있다.
#     config.import: optional:file:.env[.properties]
#   작업 폴더의 .env 파일을 읽어 오는 기능이다. 개발자 노트북에서는 편하지만
#   서버 컨테이너 안에는 그런 파일이 없고, 있어서도 안 된다.
#   값은 전부 환경변수로 들어온다.
#
# ⚠ 기본값을 두지 않는다
#   dev 는 POSTGRES_HOST 가 없으면 localhost 로 붙는다. 편하라고 그렇게 뒀다.
#   여기서 같은 짓을 하면 환경변수를 빠뜨렸을 때 조용히 엉뚱한 DB 를 보거나,
#   붙는 척하다 한참 뒤에 터진다. 없으면 아예 기동을 막는 편이 낫다.
#   빠진 변수 이름이 그대로 로그에 찍혀서 원인도 바로 보인다.
spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

    # 커넥션 풀은 HikariCP 기본값(최대 10)을 그대로 쓴다.
    # 서버1 의 PostgreSQL 은 max_connections 120 이고 지금 쓰는 연결이
    # 16 개다 (2026-09-13 실측). 기본값으로 충분해서 건드리지 않았다.
    # 앱 인스턴스를 여러 개 띄우게 되면 그때 여기서 줄여야 한다.

  # 배치 메타데이터 테이블(BATCH_JOB_*)은 collector 쪽 DB 가 갖는다.
  # 서비스 DB 에 만들지 않는다. dev 와 같다.
  batch:
    jdbc:
      initialize-schema: never
