spring:
  application:
    name: thispatch
  data:
    redis:
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}
      repositories:
        enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  deepl:
    api-key: ${DEEPL_API_KEY:}
    connect-timeout: ${DEEPL_CONNECT_TIMEOUT:3s}
    read-timeout: ${DEEPL_READ_TIMEOUT:10s}
  ai:
    base-url: ${AI_BASE_URL:}
    connect-timeout: ${AI_CONNECT_TIMEOUT:3s}
    read-timeout: ${AI_READ_TIMEOUT:30s}
  frontend-base-url: ${FRONTEND_BASE_URL}
  backend-public-url: ${BACKEND_PUBLIC_URL}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  jwt:
    algorithm: HS256
    secret: ${JWT_SECRET:}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}
  steam:
    login-code:
      ttl: ${STEAM_LOGIN_CODE_TTL:5m}
