spring:
  config:
    import: optional:file:.env[.properties]
  data:
    redis:
      host: ${REDIS_TEST_HOST:localhost}
      port: ${REDIS_TEST_PORT:6379}
      password: ""
      database: 15
      connect-timeout: 2s
      timeout: 2s
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/thispatch_test
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  batch:
    jdbc:
      initialize-schema: never
  sql:
    init:
      mode: never

app:
  ai:
    summary-cache:
      enabled: false
  frontend-base-url: http://localhost:5173
  backend-public-url: http://localhost:8080
  cors:
    allowed-origins: http://localhost:5173
  jwt:
    algorithm: HS256
    # 테스트 전용 공개 fixture. 개발·운영 서명키로 사용하지 않는다.
    secret: dGVzdC1vbmx5LWp3dC1zZWNyZXQtbmV2ZXItdXNlLWluLXByb2Q=
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  steam:
    login-code:
      ttl: 5m
