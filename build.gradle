// 루트는 아무것도 빌드하지 않는다. 공통 설정만 내려준다.
//
// 플러그인은 여기서 버전만 정하고 apply 하지 않는다(apply false).
// 필요한 모듈에서만 적용한다 — spark 모듈에 Spring Boot 플러그인이
// 붙으면 안 되기 때문이다.
plugins {
    id 'org.springframework.boot' version '3.5.16' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

// 버전은 한 곳에서 관리한다. 모듈마다 다른 버전을 쓰면
// 같은 클래스가 두 벌 들어가 런타임에 터진다.
ext {
    hadoopVersion = '3.5.0'      // 클러스터와 같아야 한다
    sparkVersion = '4.2.0'
    scalaBinary = '2.13'         // Spark 4 는 2.13 전용
}

allprojects {
    group = 'com.ssafy.thispatch'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'

    java {
        toolchain {
            // Hadoop 3.5.0 이 자바 17 바이트코드(major 61)로 컴파일돼 있고
            // Spark 4.2.0 도 17 을 요구한다. 클러스터도 17 이다.
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    dependencies {
        testImplementation platform('org.junit:junit-bom:5.11.4')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.named('test') {
        useJUnitPlatform()

        // Spark 를 테스트 JVM 안에서 띄우려면 자바 17 의 모듈 봉인을 열어 줘야 한다.
        //
        // Spark 는 sun.nio.ch.DirectBuffer 같은 내부 클래스를 직접 만진다.
        // 자바 17 은 그걸 막는데, 막혔을 때 나는 오류가 원인을 전혀 알려주지
        // 않는다 — 스택트레이스 없이 JVM 이 조용히 죽거나 엉뚱한
        // IllegalAccessError 가 난다 (노션 「데이터 정리」 측정 기록에도 같은
        // 증상이 남아 있다).
        //
        // 클러스터에서는 /opt/spark/conf/spark-defaults.conf 가 같은 일을 한다.
        // 여기는 테스트 JVM 용이다.
        jvmArgs(
                '--add-opens=java.base/java.lang=ALL-UNNAMED',
                '--add-opens=java.base/java.lang.invoke=ALL-UNNAMED',
                '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED',
                '--add-opens=java.base/java.io=ALL-UNNAMED',
                '--add-opens=java.base/java.net=ALL-UNNAMED',
                '--add-opens=java.base/java.nio=ALL-UNNAMED',
                '--add-opens=java.base/java.util=ALL-UNNAMED',
                '--add-opens=java.base/java.util.concurrent=ALL-UNNAMED',
                '--add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED',
                '--add-opens=java.base/sun.nio.ch=ALL-UNNAMED',
                '--add-opens=java.base/sun.security.action=ALL-UNNAMED')
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}
