// 스팀 카탈로그 수집 — 마스터 노트북에서 하루 한 번 돈다.
//
// 왜 별도 모듈인가
//   배포 대상이 다르다. collector 는 노트북 5대에 뿌리는 배치이고,
//   이건 마스터 한 대에서만 도는 단발 작업이다.
//
// 왜 Spring 을 안 쓰는가
//   Spring Batch 는 메타데이터 DB 가 필요하다. 이 작업은 재시작 지점을
//   기억할 이유가 없다 — 186콜 2분이고, 실패하면 그냥 다시 돌리면 된다.
//   (문서 결정 2026-09-07: 카탈로그는 증분하지 않고 매일 전량 순회)
//
// 왜 서버1 에서 안 돌리는가
//   서버1 은 서비스가 도는 곳이다. 480MB 를 받아 18만 행을 UPSERT 하면
//   4코어 16GB 를 서비스와 나눠 쓰게 된다. 받고 파싱하는 일은 노트북이
//   하고, 서버1 에는 SSH 터널로 결과만 넣는다.

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    implementation 'org.postgresql:postgresql:42.7.5'
}

// 마스터에 올려 `java -jar` 로 돌린다. 의존성을 하나로 합친다.
tasks.named('jar', Jar) {
    archiveFileName = 'thispatch-catalog.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': 'com.ssafy.thispatch.catalog.CatalogCollector'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    // 합쳐진 jar 안의 서명 파일은 무효라 그대로 두면 실행이 거부된다.
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}
