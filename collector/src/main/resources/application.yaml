spring:
  application:
    name: thispatch-collector

  # 웹 서버가 필요 없다. 워커는 큐만 듣고, 마스터는 잡을 돌리고 끝난다.
  main:
    web-application-type: none

  # 배치 메타데이터 DB — 마스터 노트북에 있다 (11-master-batch-infra.sh).
  # 서비스 DB(서버1)와 다른 DB 다. 워커가 EC2 를 볼 일이 없게 하려고 나눴다.
  datasource:
    url: jdbc:postgresql://${BATCH_DB_HOST:70.12.108.85}:${BATCH_DB_PORT:5432}/${BATCH_DB_NAME:thispatch_batch}
    username: ${BATCH_DB_USER:thispatch}
    password: ${BATCH_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # 워커마다 연결을 미리 잡아 두므로 작게 잡는다.
      #
      # 기본값 10 으로 두면 워커 4대가 40개를 점유하고, 마스터 몫까지
      # 더해 max_connections=60 을 넘겨 다음처럼 실패한다.
      #   FATAL: remaining connection slots are reserved for roles with SUPERUSER
      # 2026-09-11 실제로 겪었다.
      #
      # 배치 워커는 스텝 실행 상태를 기록할 뿐이라 연결이 많이 필요 없다.
      # ⚠ 동시성(listener.concurrency)보다 작으면 안 된다.
      #   Spring Batch 는 조각마다 진행 상태를 DB 에 쓴다. 동시에 10 조각을
      #   돌리는데 연결이 4개면 6개가 연결을 기다리며 논다.
      #
      #   예산 — 마스터 PostgreSQL 의 max_connections 는 60 이다.
      #     워커 4대 x 12 = 48
      #     매니저 1대 x  4 =  4
      #     사람·psql 여유    8
      #   합 60. 워커를 늘리려면 max_connections 부터 올려야 한다.
      maximum-pool-size: ${DB_POOL_MAX:12}
      minimum-idle: 1
      # 노트북이라 절전·무선 끊김으로 연결이 죽은 채 남는다. 오래 쥐고 있지 않는다.
      idle-timeout: 60000
      max-lifetime: 600000

  # Spring Batch 가 자기 테이블(BATCH_JOB_EXECUTION 등)을 알아서 만든다.
  # 우리 ERD 에 들어가지 않는다.
  batch:
    jdbc:
      initialize-schema: always
    job:
      # 마스터에서도 뜨자마자 돌지 않게 한다. 배치 타이머나 손으로 돌린다.
      enabled: false

  rabbitmq:
    host: ${MQ_HOST:70.12.108.85}
    port: ${MQ_PORT:5672}
    username: ${MQ_USER:thispatch}
    password: ${MQ_PASSWORD}
    virtual-host: ${MQ_VHOST:thispatch}
    listener:
      simple:
        # 워커가 죽어서 못 받은 조각은 큐에 남아 다른 워커가 가져간다.
        acknowledge-mode: auto

        # ⚠ 동시성은 여기서 정하지 않는다.
        #   이 속성들은 @RabbitListener 용이고, 우리 워커는 WorkerConfig 에서
        #   컨테이너를 직접 만든다. 거기 concurrentConsumers 가 최종값이다.
        #   바꾸려면 thispatch.collect.consumers 를 쓴다 (아래).

thispatch:
  collect:
    # 수집 대상 게임 목록을 어디서 읽는가.
    #
    # ⚠ 이 모듈에서 서비스 DB(서버1)를 보는 곳은 매니저의 이 설정 하나뿐이다.
    #   워커는 서버1 에 닿지 않는다 — EC2 에서 노트북 대역으로 나가는 경로가 없다.
    #   워커는 마스터가 보내준 appid 목록만 받는다.
    #
    # 서버1 의 5432 는 밖에서 막혀 있어 SSH 터널을 지난다. 터널은 배치를 돌리는
    # 쪽이 연다 (오케스트레이션 · 21-catalog.sh 와 같은 방식).
    service-db:
      url: ${SERVICE_DB_URL:jdbc:postgresql://127.0.0.1:15432/thispatch}
      username: ${SERVICE_DB_USER:thispatch}
      password: ${SERVICE_DB_PASSWORD:}
    # 조각 하나에 담을 게임 수. 워커 수에 맞추면 조각이 너무 커진다.
    #
    # ⚠ 이 값이 「끊겼을 때 얼마나 잃는가」를 정한다.
    #
    #   500 이면 조각 하나가 한 시간이 넘는다. 그 한 시간 중 아무 때나 무선이
    #   끊기면 그 조각을 통째로 잃는다. 실패한 조각은 큐로 돌아가지 않아서
    #   잡을 다시 띄워야 이어진다(23-collect-retry.sh).
    #
    #   2026-09-15 최초 전량 수집 실측 — 조각 235개 중 86개(37%)가 이렇게
    #   파킹됐다. 교육장 무선망이 하루에도 몇 번 끊긴다.
    #
    #   100 이면 조각 하나가 약 12분이라 한 번 끊길 때 잃는 것이 1/5 이 된다.
    #   조각 수는 234 -> 1,166 개로 늘지만 큐가 감당한다 (RabbitMQ 는 조각을
    #   메시지 하나로 들고 있을 뿐이다).
    partition-size: ${COLLECT_PARTITION_SIZE:100}
    # 워커 노트북 수. 조각을 이만큼 나눈다.
    grid-size: ${COLLECT_GRID_SIZE:4}
    # ⚠ 비워 둔다. 비어 있어야 매니저가 game 테이블에서 목록을 읽는다.
    #
    #   여기에 값이 있으면 ManagerConfig 의 @Value 기본값을 덮어써서,
    #   코드에서 기본값을 비워도 소용이 없다. 2026-09-14 에 실제로 겪었다 —
    #   전량 수집을 돌렸는데 game 테이블 116,618 개 대신 여기 적혀 있던
    #   5개만 수집했다. 조각이 234 개가 아니라 4 개인 것으로 드러났다.
    #
    #   리허설·디버깅에는 실행할 때 넘긴다:
    #     COLLECT_APPIDS=730,570  또는  --thispatch.collect.appids=730,570
    # 워커 한 대가 동시에 처리할 조각 수. 전체 수집 시간을 좌우한다.
    #   4대 x 10 = 동시 40. 노션 실측(동시 48 까지 무차단)보다 낮게 잡는다 —
    #   403 을 받으면 1시간을 쉬어야 해서 욕심내다 막히는 편이 더 손해다.
    consumers: ${COLLECT_CONSUMERS:10}
    appids: ${COLLECT_APPIDS:}
    # 워커의 Hadoop 설정. HDFS 주소/landing 경로는 common의 HdfsPaths를 따른다.
    hadoop-conf-dir: ${HADOOP_CONF_DIR:/opt/hadoop/etc/hadoop}
    # 워커 프로세스당 요청 간격. Steam의 공인 일일 한도를 보장하는 값은 아니다.
    request-interval: ${COLLECT_REQUEST_INTERVAL:1s}
    # 네트워크·408·5xx·API 일시 실패 재시도 횟수. 403/429는 별도 백오프.
    max-retries: ${COLLECT_MAX_RETRIES:5}
    # 최초 전체 수집 및 403 백오프가 1시간을 넘을 수 있다. -1은 제한 없음.
    manager-timeout-ms: ${COLLECT_MANAGER_TIMEOUT_MS:-1}

    # ── 증분 수집 ────────────────────────────────────────────
    #
    # 켜져 있으면 지난 COMPLETED 수집이 시작한 시각까지만 거슬러 받는다.
    # 성공으로 끝난 지난 수집이 없으면 알아서 전량으로 돈다.
    #
    # ⚠ 게임별 워터마크를 두지 않는다. 멈추는 조건이 게임마다 다를 이유가 없고,
    #   그 시각은 Spring Batch 가 이미 배치 DB 에 들고 있다.
    #   ManagerConfig.resolveSince 의 설명을 보라.
    #
    #   전량으로 다시 받고 싶으면:
    #     --thispatch.collect.incremental=false
    incremental: ${COLLECT_INCREMENTAL:true}

    # 지난 수집 시작 시각에서 얼마를 더 거슬러 받을지.
    # filter=updated 정렬이 1,000건에 0~1건 어긋나서 겹쳐 받는다(노션 실측).
    # 겹친 것은 ReviewLake 가 정리한다.
    slack: ${COLLECT_SLACK:1h}

    # ── 공지(패치노트) 수집 ──────────────────────────────────
    #
    # 리뷰와 큐·워커·소비자를 함께 쓴다. 스텝 이름만 다르다(collect.news).
    #
    # ⚠ 리뷰와 동시에 돌리지 않는다. 소비자 40개를 두 일이 나눠 갖게 되어
    #   둘 다 느려진다. 리뷰가 끝난 뒤에 돌린다.
    news:
      # 조각 하나에 담을 게임 수. 리뷰(100)보다 크게 잡는다 —
      # 공지는 게임당 호출 한 번이라 1,000개라도 약 17분이다.
      partition-size: ${NEWS_PARTITION_SIZE:1000}

      # 전량 수집에서 한 게임에 달라고 할 건수.
      #
      # 'count' 에 상한이 없다. 크게 줘도 있는 만큼만 온다 — CS2(총 1,756건)에
      # 10000 을 줘도 1,756건이 왔다(2026-09-15 실측). 호출은 어차피 게임당
      # 한 번이라 시간이 거의 안 늘어난다.
      #
      # 100 으로 자르면 CS2 는 1,656건, TF2 는 3,835건을 놓친다. 패치 이력은
      # 오래된 것도 있어야 "이 패치 이후 반응" 을 볼 수 있어서 전량으로 간다.
      # 게임 25개 표본 기준 11.7만 개에 약 2.2GB(gzip 0.4GB) 다.
      full-count: ${NEWS_FULL_COUNT:10000}

      # 증분 수집에서 달라고 할 건수.
      # 게임 하나가 하루에 공지를 100개 올릴 일은 없다.
      incremental-count: ${NEWS_INCREMENTAL_COUNT:100}

logging:
  level:
    com.ssafy.thispatch: INFO
    org.springframework.batch.integration.partition: INFO
