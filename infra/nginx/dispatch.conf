# 서버1 Nginx — j15a202.p.ssafy.io
#
# 이 파일은 저장소가 정본이다. 서버에서 직접 고치지 말 것.
#   /etc/nginx/sites-available/dispatch → infra/nginx/dispatch.conf (심볼릭 링크)
#   15-server-nginx-https.sh 가 링크를 걸어준다.
#
# ⚠ "# managed by Certbot" 줄을 손대지 말 것
#   아래 443 블록과 맨 끝의 80 → 443 리다이렉트 server 블록은 certbot --nginx
#   가 발급하면서 직접 써 넣은 것이다 (2026-09-11 발급). 지우면 갱신 때
#   certbot 이 다시 넣거나, 최악의 경우 HTTPS 가 내려간다.
#
#   인증서 갱신은 certbot.timer 가 자동으로 한다. 손댈 일 없다.
#     발급  2026-09-11 · 만료 2026-12-10 · 자동갱신 검증 완료
#
#   설정을 고칠 일이 생기면 이 파일을 고쳐 서버에 다시 올리고
#   sudo nginx -t && sudo systemctl reload nginx 로 반영한다.
#
# 업스트림은 전부 127.0.0.1 의 '호스트 포트' 다
#   컨테이너 이름(backend, jenkins)을 쓰지 않는 이유 —
#   ① nginx 가 네이티브라 도커 네트워크를 못 본다
#   ② 이름을 쓰면 컨테이너가 죽었을 때 nginx 가 기동 자체를 실패한다.
#      IP 리터럴이면 502 만 뜨고 나머지 경로는 계속 산다.
#   ③ 나중에 nginx 를 컨테이너로 옮겨도 이 주소가 그대로 통한다.

server {
    server_name j15a202.p.ssafy.io;

    # 업로드 여유. 리뷰 원문 API 가 커질 수 있다.
    client_max_body_size 20m;

    access_log /var/log/nginx/dispatch.access.log;
    error_log  /var/log/nginx/dispatch.error.log;

    # ── 프론트 정적 ────────────────────────────────────────
    # 아직 배포 전이라 자리표시자만 있다. FE 가 붙으면 여기에 빌드 산출물을 둔다.
    root /var/www/dispatch;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;   # SPA 라우팅
    }

    # ── 백엔드 ─────────────────────────────────────────────
    # 백엔드 컨테이너는 127.0.0.1:18081 → 컨테이너 8080 으로 발행한다.
    #
    # ⚠ /api 접두어를 '보존'한다 (proxy_pass 끝에 / 없음).
    #   백엔드에 server.servlet.context-path 가 없고 포트도 기본 8080 이라,
    #   컨트롤러가 @RequestMapping("/api/...") 로 잡혀 있다고 가정했다.
    #   컨트롤러가 /games 처럼 접두어 없이 잡혀 있으면
    #   proxy_pass 끝에 / 를 붙여 접두어를 벗겨야 한다. (리뷰 포인트)
    location /api/ {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # ── Jenkins ────────────────────────────────────────────
    # 18080 은 localhost 바인딩이고 UFW 에 열지 않았다. 외부 진입은 여기뿐이다.
    #
    # ⚠ Jenkins 를 --prefix=/jenkins 로 띄워야 한다.
    #   안 그러면 Jenkins 가 링크를 / 기준으로 만들어 화면이 깨진다.
    #   그래서 proxy_pass 끝에 / 를 붙이지 않는다 (접두어 보존).
    location /jenkins/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Jenkins 권장 설정
        proxy_redirect          http:// https://;
        proxy_max_temp_file_size 0;
        proxy_request_buffering off;     # 대용량 아티팩트 업로드
        proxy_read_timeout      90s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/j15a202.p.ssafy.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/j15a202.p.ssafy.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = j15a202.p.ssafy.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name j15a202.p.ssafy.io;
    return 404; # managed by Certbot


}
