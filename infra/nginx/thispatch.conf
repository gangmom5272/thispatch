# 서버1 Nginx — j15a202.p.ssafy.io
#
# 이 파일은 저장소가 정본이다. 서버에서 직접 고치지 말 것.
#   /etc/nginx/sites-available/thispatch → infra/nginx/thispatch.conf (심볼릭 링크)
#   15-server-nginx-https.sh 가 링크를 걸어준다.
#
# ⚠ "# managed by Certbot" 줄을 손대지 말 것
#   아래 443 블록과 맨 끝의 80 → 443 리다이렉트 server 블록은 certbot --nginx
#   가 발급하면서 직접 써 넣은 것이다 (2026-09-11 발급). 지우면 갱신 때
#   certbot 이 다시 넣거나, 최악의 경우 HTTPS 가 내려간다.
#
#   인증서 갱신은 certbot.timer 가 자동으로 한다. 손댈 일 없다.
#     발급  2026-09-11 · 만료 2026-12-10 · 자동갱신 검증 완료
#
#   설정을 고칠 일이 생기면 이 파일을 고쳐 서버에 다시 올리고
#   sudo nginx -t && sudo systemctl reload nginx 로 반영한다.
#
# 업스트림은 전부 127.0.0.1 의 '호스트 포트' 다
#   컨테이너 이름(backend, jenkins)을 쓰지 않는 이유 —
#   ① nginx 가 네이티브라 도커 네트워크를 못 본다
#   ② 이름을 쓰면 컨테이너가 죽었을 때 nginx 가 기동 자체를 실패한다.
#      IP 리터럴이면 502 만 뜨고 나머지 경로는 계속 산다.
#   ③ 나중에 nginx 를 컨테이너로 옮겨도 이 주소가 그대로 통한다.

server {
    server_name j15a202.p.ssafy.io;

    # 업로드 여유. 리뷰 원문 API 가 커질 수 있다.
    client_max_body_size 20m;

    access_log /var/log/nginx/thispatch.access.log;
    error_log  /var/log/nginx/thispatch.error.log;

    # ── 프론트 정적 ────────────────────────────────────────
    # frontend/Jenkinsfile 이 pnpm build 결과(dist)를 여기에 넣는다.
    # 컨테이너로 띄우지 않는 이유는 그 파일 주석에 적어 뒀다.
    #
    # ⚠ current 는 심링크다.
    #   실제 파일은 /var/www/thispatch/releases/<빌드번호>/ 에 쌓인다.
    #   배포는 이 심링크를 바꾸는 것뿐이라 중간 상태가 없고,
    #   되돌릴 때도 심링크만 옮기면 된다.
    root /var/www/thispatch/current;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;   # SPA 라우팅
    }

    # Vite 는 파일 이름에 내용 해시를 박아서 내보낸다 (index-a1b2c3.js).
    # 내용이 바뀌면 이름도 바뀌므로, 오래 캐시해 두어도 낡은 파일을 볼 일이 없다.
    #
    # ⚠ index.html 은 여기 해당되지 않는다.
    #   그 파일은 이름이 고정이라, 캐시하면 새로 배포해도 사용자가
    #   옛 화면을 계속 보게 된다. / 는 위 location 이 받으므로 캐시가 안 붙는다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── 백엔드 ─────────────────────────────────────────────
    # 백엔드 컨테이너는 127.0.0.1:18081 → 컨테이너 8080 으로 발행한다.
    #
    # ⚠ /api 접두어를 '벗긴다' (proxy_pass 끝에 / 있음).
    #
    #   API 계약이 접두어 없이 정의돼 있다 — backend/docs/api/ 참고.
    #     GET /games · GET /games/{gameId}/reviews · POST /auth/login ...
    #
    #   그래서 밖에서는 /api/games 로 받고 백엔드에는 /games 로 넘긴다.
    #   끝의 / 하나가 그 일을 한다. 지우면 백엔드가 /api/games 를 받아 404 가 난다.
    #
    #   이 방식을 고른 이유는 백엔드를 안 건드려도 되기 때문이다.
    #   context-path: /api 를 주는 방법도 있지만, 그러면 로컬 테스트도
    #   localhost:8080/api/games 가 되어 계약과 어긋난다. (2026-09-13 확정)
    location /api/ {
        proxy_pass http://127.0.0.1:18081/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # ── Jenkins ────────────────────────────────────────────
    # 18080 은 localhost 바인딩이고 UFW 에 열지 않았다. 외부 진입은 여기뿐이다.
    #
    # ⚠ Jenkins 를 --prefix=/jenkins 로 띄워야 한다.
    #   안 그러면 Jenkins 가 링크를 / 기준으로 만들어 화면이 깨진다.
    #   그래서 proxy_pass 끝에 / 를 붙이지 않는다 (접두어 보존).
    location /jenkins/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Jenkins 권장 설정
        proxy_redirect          http:// https://;
        proxy_max_temp_file_size 0;
        proxy_request_buffering off;     # 대용량 아티팩트 업로드
        proxy_read_timeout      90s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/j15a202.p.ssafy.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/j15a202.p.ssafy.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = j15a202.p.ssafy.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name j15a202.p.ssafy.io;
    return 404; # managed by Certbot


}
