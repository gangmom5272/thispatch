// Spark 잡 — 집계 · compaction · JSON→Parquet 변환.
//
// Spring 을 넣지 않는다. Spark 4.2.0 과 Spring Boot 3.5 는
// Jackson · Netty · Guava 버전이 겹쳐서, 빌드는 통과하는데 실행할 때
// NoSuchMethodError 로 터진다. 원인을 찾기도 어렵다.
//
// Spark 자체도 jar 에 넣지 않는다. spark-submit 이 클러스터의
// /opt/spark 에서 제공한다. 넣으면 버전이 두 벌이 되어 더 위험하다.

dependencies {
    implementation project(':common')

    compileOnly "org.apache.spark:spark-core_${rootProject.ext.scalaBinary}:${rootProject.ext.sparkVersion}"
    compileOnly "org.apache.spark:spark-sql_${rootProject.ext.scalaBinary}:${rootProject.ext.sparkVersion}"

    testImplementation "org.apache.spark:spark-core_${rootProject.ext.scalaBinary}:${rootProject.ext.sparkVersion}"
    testImplementation "org.apache.spark:spark-sql_${rootProject.ext.scalaBinary}:${rootProject.ext.sparkVersion}"
}

// spark-submit 에 넘길 jar 를 만든다.
//
// common 이 별도 jar 라 --jars 로 같이 넘겨야 하는데, 작은 파일 두 개를
// 매번 챙기는 것보다 하나로 합치는 편이 운영이 쉽다.
// Spark 는 compileOnly 라 여기 들어가지 않는다.
tasks.named('jar', Jar) {
    archiveFileName = 'dispatch-spark.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}
